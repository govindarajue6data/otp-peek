<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="options">
    <h1>OTP Peek settings</h1>
    <label for="labels">Extra Gmail labels to check</label>
    <p class="hint">
      OTP Peek reads unread mail in your Inbox. If a Gmail filter puts codes
      under a label and skips the Inbox, list that label here, one per line,
      exactly as it appears in Gmail. Up to 10.
    </p>
    <textarea id="labels" rows="5" spellcheck="false" placeholder="OTP"></textarea>
    <button id="save" class="row">Save</button>
    <p id="status" hidden></p>
    <script src="extractor.js"></script>
    <script src="options.js"></script>
  </body>
</html>
